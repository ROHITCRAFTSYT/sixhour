[project]
name = "sixhour"
version = "0.1.0"
description = "Breach-clock copilot: from raw logs to a CERT-In report and DPDP breach notices before the deadline."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
]

[project.scripts]
sixhour = "sixhour.server:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sixhour"]

[tool.pytest.ini_options]
testpaths = ["tests"]

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.15 is what the production container runs.
        python-version: ["3.11", "3.12", "3.13", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.23" # same uv as the Dockerfile
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      # --locked: install exactly what uv.lock pins, and fail if the lock is stale.
      - run: uv sync --locked
      - run: uv run --frozen ruff check .
      - run: uv run --frozen ruff format --check .
      - run: uv run --frozen pytest -q

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build -t sixhour .
      - name: Container starts and answers
        run: |
          docker run -d --name sixhour -p 8080:8080 sixhour
          for i in $(seq 1 20); do curl -fs http://127.0.0.1:8080/healthz && exit 0; sleep 1; done
          docker logs sixhour; exit 1

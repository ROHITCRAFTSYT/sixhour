name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e . pytest ruff
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build -t sixhour .
      - name: Container starts and answers
        run: |
          docker run -d --name sixhour -p 8080:8080 sixhour
          for i in $(seq 1 20); do curl -fs http://127.0.0.1:8080/healthz && exit 0; sleep 1; done
          docker logs sixhour; exit 1
